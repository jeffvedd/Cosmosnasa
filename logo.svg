      <stop offset="100%" style="stop-color:#080820"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <rect width="198" height="198" x="1" y="1" rx="39" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2"/>
